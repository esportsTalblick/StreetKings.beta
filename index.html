<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#080B08">
  <title>STREET KINGS MANAGER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="crest-button" data-screen="home" aria-label="Home">
        <img src="./assets/branding/logo-shield.png" alt="SKM" onerror="this.style.display='none';this.parentElement.classList.add('crest-fallback')">
        <span>SKM</span>
      </button>
      <div class="season">
        <small>S1 · W1</small>
        <strong>46.357 €</strong>
      </div>
      <button class="profile-dot" id="profileBtn" aria-label="Profil"></button>
    </header>

    <main id="screen" class="screen"></main>

    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <button data-screen="home"><span class="nav-icon"><img src="./assets/icons/home.png" alt=""></span><b>Home</b></button>
      <button data-screen="club"><span class="nav-icon"><img src="./assets/icons/verein.png" alt=""></span><b>Verein</b></button>
      <button data-screen="play"><span class="nav-icon play-icon"><img src="./assets/icons/spielen.png" alt=""></span><b>Spielen</b></button>
      <button data-screen="market"><span class="nav-icon"><img src="./assets/icons/markt.png" alt=""></span><b>Markt</b></button>
      <button data-screen="menu"><span class="nav-icon"><img src="./assets/icons/menu.png" alt=""></span><b>Menü</b></button>
    </nav>
  </div>
  <script src="./app.js"></script>
</body>
</html>
